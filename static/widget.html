<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>FAQ Bot Demo</title>
<style>
  :root {
    --primary: #4f46e5;
    --primary-dark: #4338ca;
    --bg: #f4f5f9;
    --bubble-bot: #ffffff;
    --bubble-user: #4f46e5;
    --text-dark: #1f2937;
    --text-light: #6b7280;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 24px;
  }
  .page-title {
    position: fixed;
    top: 24px;
    left: 24px;
    color: var(--text-dark);
  }
  .page-title h1 { margin: 0 0 4px 0; font-size: 20px; }
  .page-title p { margin: 0; font-size: 13px; color: var(--text-light); max-width: 320px; }

  .chat-card {
    width: 380px;
    height: 560px;
    background: var(--bubble-bot);
    border-radius: 18px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.12);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .chat-header {
    background: linear-gradient(135deg, var(--primary), var(--primary-dark));
    color: white;
    padding: 18px 20px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .chat-header .dot {
    width: 8px; height: 8px; border-radius: 50%; background: #4ade80;
  }
  .chat-header .title { font-weight: 600; font-size: 15px; }
  .chat-header .subtitle { font-size: 12px; opacity: 0.85; }

  .chat-body {
    flex: 1;
    padding: 16px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .msg { max-width: 80%; padding: 10px 14px; border-radius: 14px; font-size: 14px; line-height: 1.4; }
  .msg.bot { align-self: flex-start; background: #f1f2f6; color: var(--text-dark); border-bottom-left-radius: 4px; }
  .msg.user { align-self: flex-end; background: var(--bubble-user); color: white; border-bottom-right-radius: 4px; }
  .msg.meta { font-size: 11px; color: var(--text-light); margin-top: 4px; }

  .chat-footer {
    display: flex;
    padding: 12px;
    border-top: 1px solid #eee;
    gap: 8px;
  }
  .chat-footer input {
    flex: 1;
    border: 1px solid #e5e7eb;
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 14px;
    outline: none;
  }
  .chat-footer input:focus { border-color: var(--primary); }
  .chat-footer button {
    background: var(--primary);
    color: white;
    border: none;
    border-radius: 10px;
    padding: 0 16px;
    font-size: 14px;
    cursor: pointer;
  }
  .chat-footer button:hover { background: var(--primary-dark); }

  .suggestions {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    padding: 0 16px 12px 16px;
  }
  .chip {
    font-size: 12px;
    background: #eef0ff;
    color: var(--primary-dark);
    padding: 6px 10px;
    border-radius: 999px;
    cursor: pointer;
    white-space: nowrap;
  }
  .chip:hover { background: #dfe2ff; }
</style>
</head>
<body>

<div class="page-title">
  <h1>FAQ Bot</h1>
  <p>Drop-in AI chatbot that answers from your own business FAQs. Try asking a question below.</p>
</div>

<div class="chat-card">
  <div class="chat-header">
    <span class="dot"></span>
    <div>
      <div class="title" id="biz-name">Demo Store Assistant</div>
      <div class="subtitle">Usually replies instantly</div>
    </div>
  </div>

  <div class="chat-body" id="chat-body">
    <div class="msg bot">Hi! Ask me anything about our store - hours, shipping, returns, payments...</div>
  </div>

  <div class="suggestions" id="suggestions"></div>

  <div class="chat-footer">
    <input type="text" id="chat-input" placeholder="Type your question..." />
    <button id="send-btn">Send</button>
  </div>
</div>

<script>
const API_BASE = window.location.origin;
const chatBody = document.getElementById('chat-body');
const chatInput = document.getElementById('chat-input');
const sendBtn = document.getElementById('send-btn');
const suggestionsEl = document.getElementById('suggestions');

const sampleSuggestions = [
  "What are your store hours?",
  "Do you offer refunds?",
  "How long does shipping take?"
];

function renderSuggestions() {
  suggestionsEl.innerHTML = '';
  sampleSuggestions.forEach(q => {
    const chip = document.createElement('div');
    chip.className = 'chip';
    chip.textContent = q;
    chip.onclick = () => { chatInput.value = q; sendMessage(); };
    suggestionsEl.appendChild(chip);
  });
}
renderSuggestions();

function addMessage(text, sender, meta) {
  const msg = document.createElement('div');
  msg.className = 'msg ' + sender;
  msg.textContent = text;
  chatBody.appendChild(msg);
  if (meta) {
    const metaEl = document.createElement('div');
    metaEl.className = 'msg meta';
    metaEl.textContent = meta;
    chatBody.appendChild(metaEl);
  }
  chatBody.scrollTop = chatBody.scrollHeight;
}

async function sendMessage() {
  const text = chatInput.value.trim();
  if (!text) return;
  addMessage(text, 'user');
  chatInput.value = '';

  try {
    const res = await fetch(API_BASE + '/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: text })
    });
    const data = await res.json();
    addMessage(data.answer, 'bot');
  } catch (err) {
    addMessage("Sorry, I couldn't reach the server. Is the FastAPI backend running?", 'bot');
  }
}

sendBtn.addEventListener('click', sendMessage);
chatInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendMessage(); });

// Load business name dynamically
fetch(API_BASE + '/').then(r => r.json()).then(d => {
  document.getElementById('biz-name').textContent = d.business_name + ' Assistant';
}).catch(() => {});
</script>

</body>
</html>
